[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "neural-network-ids"
version = "0.1.0"
description = "CIC-IDS2017 flow-based intrusion detection experiments"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "pandas>=2.0",
    "scikit-learn>=1.3",
    "torch>=2.1",
    "matplotlib>=3.7",
    "seaborn>=0.12",
]

[project.optional-dependencies]
dashboard = ["streamlit>=1.30"]
dev = ["jupyter>=1.0", "ruff>=0.3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
